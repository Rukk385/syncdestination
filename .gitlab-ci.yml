stages:
  - sync

sync_to_github:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache ansible git openssh-client
    - mkdir -p ~/.ssh
    # Load the SSH key from GitLab CI/CD Variables
    - cp "$GITHUB_SSH_KEY" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - ansible-playbook sync.yml
  when: manual  # This makes the job triggerable only by a human
  only:
    - sync      # Only runs if the pipeline is on the 'sync' branch