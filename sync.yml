---
- name: Sync GitLab branch to GitHub
  hosts: localhost
  connection: local
  gather_facts: yes  # Needed to populate ansible_env
  vars:
    dest_repo: "git@github.com:Rukk385/syncdestination.git"
    sync_branch: "sync"
    dest_branch: "main"

  tasks:
    - name: Ensure SSH directory exists
      file:
        path: "~/.ssh"
        state: directory
        mode: '0700'

    - name: Configure SSH to skip host key checking
      copy:
        content: |
          Host github.com
              StrictHostKeyChecking no
        dest: "~/.ssh/config"
        mode: '0600'

    - name: Sync and Push to GitHub
      shell: |
        git config --global user.email "ci@gitlab.com"
        git config --global user.name "GitLab CI"
        git remote add github "{{ dest_repo }}" || git remote set-url github "{{ dest_repo }}"
        git fetch origin "{{ sync_branch }}"
        git checkout -B "{{ sync_branch }}" "origin/{{ sync_branch }}"
        git rm .gitlab-ci.yml sync.yml
        git commit -m "Internal: Strip CI/CD automation for GitHub mirror"
        git push github "{{ sync_branch }}:{{ dest_branch }}" --force
      args:
        chdir: "{{ ansible_facts['env']['CI_PROJECT_DIR'] }}"